<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>StudyStack - Flashcards & Study Aid</title>
    <meta name="author" content="Victor" />
    <meta
      name="description"
      content="an application made to be used as a study aid for the purpose of studying material using flahscards and other learning materialsStudyStack is a free tool for building and reviewing digital flashcards, designed to help students study more efficiently and retain material longer."
      />
      <meta
      name="keywords"
      content="study aids, flashcards, learning materials, studying"
      />
      <link
      rel="icon"
      href="favicon.ico"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="assets/vendor/normalize.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#">My Decks</a></li>
          <li><a class="nav__link" href="#">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content page__main-content_location_carousel">
      <section id="carousel" class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
          <div class="carousel__row">
          <button
            type="button"
            aria-label="Go to previous card in deck"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <div class="carousel__card">
          <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          </div>
          <button
            type="button"
            aria-label="Go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
          ></button>
          </div>
          <button
            type="button"
            aria-label="flip card"
            class="carousel__btn carousel__btn_type_flip"
          ></button>
      </section>
    </main>
    <footer class="footer"
    <p class="footer__text">&copy; 2026 Victor</p>
  </footer>
  </body>
</html>
